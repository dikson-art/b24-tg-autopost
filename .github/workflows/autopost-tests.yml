name: Autopost offline tests
on:
  pull_request:
    paths:
      - 'tools/b24-autopost/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
